<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Access Portal</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<main class="panel">
    <p class="eyebrow">Access Portal</p>
    <h1>Sign in</h1>
    <p class="notice" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <form method="post" th:action="@{/login}">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
    <p>New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
