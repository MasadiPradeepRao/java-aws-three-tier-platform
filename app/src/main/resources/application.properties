spring.application.name=access-portal

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/access_portal}
spring.datasource.username=${DB_USERNAME:access_portal}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-message=never
