name: Build, scan, and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Maven verification and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Verify app and run SpotBugs
        run: mvn --batch-mode --no-transfer-progress --file app/pom.xml verify

  image:
    name: Build and scan container
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build container image
        run: docker build --file app/Dockerfile --tag access-portal:ci .

      - name: Scan container image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: access-portal:ci
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Save scanned image for publishing
        run: docker save access-portal:ci --output access-portal.tar

      - name: Transfer scanned image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-container-image
          path: access-portal.tar
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish image to GHCR
    needs: [verify, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: scanned-container-image
          path: image

      - name: Load scanned image
        run: docker load --input image/access-portal.tar

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the scanned image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag access-portal:ci "$image:sha-${GITHUB_SHA}"
          docker tag access-portal:ci "$image:latest"
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:latest"

  publish-ecr:
    name: Publish scanned image to Amazon ECR
    needs: [verify, image]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.ECR_REPOSITORY_URI != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: scanned-container-image
          path: image

      - name: Load scanned image
        run: docker load --input image/access-portal.tar

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}
          role-duration-seconds: 1800

      - name: Log in to Amazon ECR
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        shell: bash
        run: |
          registry="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

      - name: Publish the scanned image with SHA and latest tags
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          docker tag access-portal:ci "$ECR_REPOSITORY_URI:sha-${GITHUB_SHA}"
          docker tag access-portal:ci "$ECR_REPOSITORY_URI:latest"
          docker push "$ECR_REPOSITORY_URI:sha-${GITHUB_SHA}"
          docker push "$ECR_REPOSITORY_URI:latest"

      - name: Roll out the image to running application instances
        if: vars.SSM_RESTART_DOCUMENT_NAME != '' && vars.APP_INSTANCE_NAME != ''
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SSM_RESTART_DOCUMENT_NAME: ${{ vars.SSM_RESTART_DOCUMENT_NAME }}
          APP_INSTANCE_NAME: ${{ vars.APP_INSTANCE_NAME }}
        shell: bash
        run: |
          instance_ids="$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=$APP_INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"

          if [[ -z "$instance_ids" || "$instance_ids" == "None" ]]; then
            echo "No running app instances found; new instances will pull the published latest image."
            exit 0
          fi

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "$SSM_RESTART_DOCUMENT_NAME" \
            --targets "Key=tag:Name,Values=$APP_INSTANCE_NAME" \
            --max-concurrency 1 \
            --max-errors 0 \
            --timeout-seconds 420 \
            --comment "Deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"
          echo "Waiting for SSM rollout command $command_id"

          for attempt in {1..160}; do
            statuses="$(aws ssm list-command-invocations \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --query 'CommandInvocations[].Status' \
              --output text)"

            if [[ "$statuses" =~ ^Success([[:space:]]+Success)*$ ]]; then
              echo "Application instances are healthy on the new image."
              exit 0
            fi

            if [[ "$statuses" =~ (Failed|TimedOut|Cancelled|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform) ]]; then
              aws ssm list-command-invocations \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --details \
                --query 'CommandInvocations[].{InstanceId:InstanceId,Status:Status,Output:CommandPlugins[0].Output}' \
                --output table
              exit 1
            fi

            sleep 5
          done

          echo "SSM rollout did not complete before the workflow timeout." >&2
          aws ssm list-command-invocations \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --details \
            --query 'CommandInvocations[].{InstanceId:InstanceId,Status:Status,Output:CommandPlugins[0].Output}' \
            --output table
          exit 1
